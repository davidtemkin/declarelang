<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3efe7">
<title>Cadence</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <span class="brand">Cadence</span>
  <span class="top-date label" id="top-date"></span>
  <button class="log-desk" id="log-desk" type="button">Log session <kbd>N</kbd></button>
</header>

<main class="layout" id="main" aria-busy="true">
  <section class="today" aria-label="Today">
    <div class="live" id="live" hidden></div>

    <div class="week">
      <h2 class="label">This week <span class="label-sub" id="week-range"></span></h2>
      <p class="hero" id="week-line"></p>
    </div>

    <div class="streak">
      <h2 class="label">Streak</h2>
      <p class="hero hero-2" id="streak-line"></p>
    </div>

    <div class="shape" id="shape" role="group" aria-label="The week's shape"></div>

    <button class="last" id="last" type="button"></button>
  </section>

  <section class="year" aria-label="The year">
    <div class="year-head">
      <h2 class="label">The year <span class="label-sub" id="period-span"></span></h2>
      <p class="period-when" id="period-when"></p>
      <p class="period-stats" id="period-stats"></p>
    </div>
    <div class="zoom" role="group" aria-label="Zoom">
      <button type="button" data-span="14">2 wk</button>
      <button type="button" data-span="91">3 mo</button>
      <button type="button" data-span="182">6 mo</button>
      <button type="button" data-span="all">All</button>
      <button type="button" data-now class="zoom-now">Today →</button>
    </div>
    <div class="surface" id="surface" tabindex="0" aria-label="Training history. Drag to move through time, pinch or scroll to zoom, arrow keys to move, plus and minus to zoom.">
      <svg id="chart" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true"></svg>
    </div>
    <p class="legend label">Bar height = duration · colour = effort · shading = hours over the past 7 days</p>
    <button class="period-peak" id="period-peak" type="button" hidden></button>
    <div class="period-list" id="period-list"></div>
  </section>
</main>

<div class="actionbar">
  <button class="log-phone" id="log-phone" type="button"><span class="plus" aria-hidden="true">+</span> Log a session</button>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-grip" id="sheet-grip" aria-hidden="true"><span></span></div>
  <div class="sheet-body" id="sheet-body"></div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js"></script>
</body>
</html>
