<!doctype html>
<meta charset="utf-8">
<title>provides</title>
<div id="box" style="width:400px;height:120px" data-declare-provide='{"greeting":"from the attribute"}'></div>
<script type="module">
  import boot, { observe } from "../../../bundles/declare-boot.js";
  const tenant = await boot({ main: "./provides.declare", host: document.getElementById("box"), provides: { greeting: "hello" } });
  const seen = [];
  observe(() => tenant.app.greeting, (v) => seen.push(v));
  window.__seen = seen;
  window.__first = tenant.app.greeting;
  tenant.provide("greeting", "bye");
</script>
